<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragrafos</title>
</head>
<body>
    <!--tag paragrafo-->>
<p>Isso e um Paragrafos</p>

<!--Strong : importancia-->

<p>conheça o <strong> iphone 17</strong></p>

<!-- em : enfase -->

<p>esse da enfase <em>em italico</em><p>

<!--u : sublinhdo-->

<p>deixa o texto <u>sublinhado</u></p>

<!--small : pequeno-->>

<p>deixa o texto <small>pequeno<small></p>

</body>
</html>
